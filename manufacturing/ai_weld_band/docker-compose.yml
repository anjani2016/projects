version: '3.8'

# Band of Agents Hackathon — ai-weld-band-hackathon
# Multi-agent NDT Inspector with Band coordination layer

services:
  backend:
    build: .
    container_name: weld_band_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights
    environment:
      - API_URL=http://localhost:8000
      - GOOGLE_CLOUD_PROJECT=ai-weld-band-hackathon
      - GOOGLE_CLOUD_LOCATION=us-central1
    env_file:
      - .env
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: weld_band_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    env_file:
      - .env
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
