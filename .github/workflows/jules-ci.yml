name: Multi-Project Workspace Auto-Heal

on:
  push:
    branches: [ main, dev, 'feature/**' ]

jobs:
  test-and-heal:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      fail-fast: false 
      matrix:
        # We transform 'project' into an object array defining the folder AND its language
        include:
          - project: 'energy/ieso_hedging_tool'
            lang: 'python'
          - project: 'energy/energy_data'
            lang: 'python'
          - project: 'energy/ontario_grid_twin'
            lang: 'python'
          - project: 'economy/affordability_infra_digital_twin'
            lang: 'python'
          # - project: 'android/android_sampleproject'
          #  lang: 'android' # Note: Android CI steps are not yet configured below
          - project: 'manufacturing/ai_weld_rt_train'
            lang: 'python'
          - project: 'manufacturing/ai_weld_hackathon'
            lang: 'python'
          - project: 'esg/lake_digital_twin'
            lang: 'python'
          - project: 'esg/tracy_arm_flord_landslide'
            lang: 'python'
          - project: 'erm/risk_demo'
            lang: 'python'

    defaults:
      run:
        working-directory: ./${{ matrix.project }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # 🐍 STEP 1A: Setup Python (Only fires if the project language is Python)
      - name: Set Up Python Environment
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        if: matrix.lang == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ⬢ STEP 1B: Setup Node/TypeScript (Only fires if the project language is TypeScript)
      - name: Set Up Node.js Environment
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Speeds up builds by caching node_modules
          cache-dependency-path: ./${{ matrix.project }}/package-lock.json

      - name: Install TypeScript Dependencies
        if: matrix.lang == 'typescript'
        run: npm ci

      # ⚙️ STEP 2: Run the respective Test Suite dynamically
      - name: Run Python Test Suite
        id: run-python-tests
        if: matrix.lang == 'python'
        run: python -m pytest
        continue-on-error: true

      - name: Run TypeScript Test Suite
        id: run-ts-tests
        if: matrix.lang == 'typescript'
        run: npm test -- tests/unit/
        continue-on-error: true

      # 🤖 STEP 3: Trigger Jules with language-aware operational boundaries
      - name: Invoke Jules Auto-Healer
        # Trigger if EITHER the python test lane OR the typescript test lane fails
        if: steps.run-python-tests.outcome == 'failure' || steps.run-ts-tests.outcome == 'failure'
        uses: google-labs-code/jules-invoke@main
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.ref_name }}
          include_last_commit: ''
          include_commit_log: ''
          prompt: |
            The local CI verification execution has failed inside the ${{ matrix.lang }} subproject directory: "./${{ matrix.project }}".
            
            Please execute the following remediation loop:
            1. Analyze the failed test logs belonging to the `./${{ matrix.project }}/tests/unit/` folder path.
            2. Cross-reference the failures against our modular engineering principles (keep modules atomic, functions under 40 lines).
            3. Implement required code updates specifically inside `./${{ matrix.project }}/src/`. Do not modify the test assertions.
            4. Re-verify by running the appropriate test runner command (`pytest` for Python, `npm test` for TypeScript) within your sandbox VM environment.
            5. Submit a targeted Pull Request containing the fixed modules.