[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ieso_hedging_tool"
version = "0.1.0"
description = "Financial Digital Twin for Ontario industrial energy consumers"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit",
    "plotly",
    "pandas",
    "numpy",
    "requests",
    "python-dotenv",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
